    <circle cx="72" cy="24" r="1.5" fill="#3B82F6"/>
    <circle cx="24" cy="48" r="1.5" fill="#3B82F6"/>
    <circle cx="24" cy="72" r="1.5" fill="#3B82F6"/>
    <circle cx="376" cy="24" r="1.5" fill="#3B82F6"/>
    <circle cx="352" cy="24" r="1.5" fill="#3B82F6"/>
    <circle cx="328" cy="24" r="1.5" fill="#3B82F6"/>
    <circle cx="376" cy="48" r="1.5" fill="#3B82F6"/>
    <circle cx="376" cy="72" r="1.5" fill="#3B82F6"/>
    <circle cx="24" cy="376" r="1.5" fill="#3B82F6"/>
    <circle cx="48" cy="376" r="1.5" fill="#3B82F6"/>
    <circle cx="72" cy="376" r="1.5" fill="#3B82F6"/>
    <circle cx="24" cy="352" r="1.5" fill="#3B82F6"/>
    <circle cx="24" cy="328" r="1.5" fill="#3B82F6"/>
    <circle cx="376" cy="376" r="1.5" fill="#3B82F6"/>
    <circle cx="352" cy="376" r="1.5" fill="#3B82F6"/>
    <circle cx="328" cy="376" r="1.5" fill="#3B82F6"/>
    <circle cx="376" cy="352" r="1.5" fill="#3B82F6"/>
