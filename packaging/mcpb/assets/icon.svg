  </g>

  <!-- Corner registration marks -->
  <g stroke="#3B82F6" stroke-width="0.75" opacity="0.3">
    <line x1="16" y1="16" x2="40" y2="16"/>
    <line x1="16" y1="16" x2="16" y2="40"/>
    <line x1="360" y1="16" x2="384" y2="16"/>
    <line x1="384" y1="16" x2="384" y2="40"/>
    <line x1="16" y1="384" x2="40" y2="384"/>
    <line x1="16" y1="360" x2="16" y2="384"/>
    <line x1="360" y1="384" x2="384" y2="384"/>
    <line x1="384" y1="360" x2="384" y2="384"/>
  </g>

  <!-- Registration crosshair top-right -->
  <g stroke="#3B82F6" stroke-width="0.5" opacity="0.2">
    <line x1="340" y1="60" x2="370" y2="60"/>
    <line x1="355" y1="45" x2="355" y2="75"/>
    <circle cx="355" cy="60" r="8" fill="none"/>
  </g>

  <!-- F mark - main icon -->
  <rect x="90" y="60" width="220" height="280" rx="6" stroke="#2563EB" stroke-width="3.5" fill="none"/>
  <line x1="124" y1="130" x2="276" y2="130" stroke="#2563EB" stroke-width="3.5"/>
  <line x1="124" y1="195" x2="230" y2="195" stroke="#2563EB" stroke-width="3.5"/>
  <line x1="124" y1="60" x2="124" y2="340" stroke="#2563EB" stroke-width="4"/>

  <!-- Dimension lines -->
  <g stroke="#3B82F6" stroke-width="0.75" opacity="0.35" stroke-dasharray="3 3">
    <!-- Bottom dimension -->
    <line x1="90" y1="365" x2="310" y2="365"/>
    <line x1="90" y1="358" x2="90" y2="372"/>
    <line x1="310" y1="358" x2="310" y2="372"/>
    <!-- Right dimension -->
    <line x1="335" y1="60" x2="335" y2="340"/>
    <line x1="328" y1="60" x2="342" y2="60"/>
    <line x1="328" y1="340" x2="342" y2="340"/>
  </g>

  <!-- Annotation labels -->
  <text x="200" y="390" font-family="JetBrains Mono, monospace" font-size="8" fill="#3B82F6" opacity="0.4" text-anchor="middle" letter-spacing="0.1em">220.0</text>
  <text x="355" y="204" font-family="JetBrains Mono, monospace" font-size="8" fill="#3B82F6" opacity="0.4" text-anchor="middle" letter-spacing="0.1em" transform="rotate(90, 355, 204)">280.0</text>

  <!-- Version annotation bottom-right -->
  <text x="376" y="396" font-family="JetBrains Mono, monospace" font-size="7" fill="#3B82F6" opacity="0.3" text-anchor="end" letter-spacing="0.15em">REV 1.0</text>
